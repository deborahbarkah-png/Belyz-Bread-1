<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dad's Bakery - Bread Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fdf6ec;
    color: #3a2a1a;
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
    line-height: 1.5;
  }
  h1 { font-size: 1.5rem; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: #8a6a4a; font-size: 0.85rem; margin-bottom: 20px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab {
    flex: 1; padding: 10px 4px; text-align: center; font-size: 0.8rem;
    background: #fff; border: 2px solid #e0cbb0; border-radius: 10px;
    cursor: pointer; font-weight: 600; color: #8a6a4a;
  }
  .tab.active { background: #c47a3a; color: #fff; border-color: #c47a3a; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: #fff; border-radius: 12px; padding: 16px;
    margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  .card h2 { font-size: 1rem; margin-bottom: 12px; color: #c47a3a; }
  label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: #6a4a2a; }
  input, select {
    width: 100%; padding: 10px; font-size: 1rem; margin-bottom: 12px;
    border: 2px solid #e0cbb0; border-radius: 8px; background: #fffdf9;
  }
  input:focus, select:focus { outline: none; border-color: #c47a3a; }
  button {
    width: 100%; padding: 12px; font-size: 1rem; font-weight: 700;
    background: #c47a3a; color: #fff; border: none; border-radius: 8px;
    cursor: pointer;
  }
  button:active { background: #a5622a; }
  .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0e4d4; font-size: 0.9rem; }
  .row:last-child { border-bottom: none; }
  .row .label { color: #8a6a4a; }
  .row .value { font-weight: 700; }
  .empty { text-align: center; color: #b0a090; font-size: 0.85rem; padding: 16px; }
  .money { color: #2a7a3a; }
  .owed { color: #a53a3a; }
  .item { background: #fdf6ec; border-radius: 8px; padding: 10px; margin-bottom: 8px; font-size: 0.85rem; }
  .item strong { color: #c47a3a; }
</style>
</head>
<body>

<h1>🍞 Dad's Bakery</h1>
<p class="subtitle">Bread Allocation & Commission Tracker</p>

<div class="tabs">
  <div class="tab active" onclick="showTab('baker')">Baker</div>
  <div class="tab" onclick="showTab('manager')">Manager</div>
  <div class="tab" onclick="showTab('sales')">Sales</div>
  <div class="tab" onclick="showTab('report')">Report</div>
</div>

<!-- BAKER TAB -->
<div id="baker" class="panel active">
  <div class="card">
    <h2>Log Finished Bread</h2>
    <label>Bread Type</label>
    <input id="bakeType" placeholder="e.g. Sourdough Loaf">
    <label>Quantity Baked</label>
    <input id="bakeQty" type="number" placeholder="e.g. 50">
    <button onclick="addBatch()">Add to Stock</button>
  </div>
  <div class="card">
    <h2>Available Stock</h2>
    <div id="stockList"></div>
  </div>
</div>

<!-- MANAGER TAB -->
<div id="manager" class="panel">
  <div class="card">
    <h2>Share Bread with Salesperson</h2>
    <label>Salesperson Name</label>
    <input id="salesName" placeholder="e.g. Kofi">
    <label>Bread Type</label>
    <select id="assignBread"></select>
    <label>Quantity Given</label>
    <input id="assignQty" type="number" placeholder="e.g. 20">
    <label>Price per Unit (GHS)</label>
    <input id="assignPrice" type="number" placeholder="e.g. 10">
    <label>Commission Rate (%)</label>
    <input id="assignComm" type="number" value="10">
    <button onclick="assignBread()">Assign Bread</button>
  </div>
</div>

<!-- SALES TAB -->
<div id="sales" class="panel">
  <div class="card">
    <h2>My Assigned Bread</h2>
    <label>Select Your Name</label>
    <select id="salesPicker" onchange="renderSalesView()"></select>
    <div id="salesView"></div>
  </div>
</div>

<!-- REPORT TAB -->
<div id="report" class="panel">
  <div class="card">
    <h2>Full Summary</h2>
    <div id="reportView"></div>
  </div>
</div>

<script>
// ---------- DATA ----------
let batches = JSON.parse(localStorage.getItem('bakery_batches') || '[]');
let allocations = JSON.parse(localStorage.getItem('bakery_allocations') || '[]');

function save() {
  localStorage.setItem('bakery_batches', JSON.stringify(batches));
  localStorage.setItem('bakery_allocations', JSON.stringify(allocations));
}

function showTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById(id).classList.add('active');
  if (id === 'manager') refreshBreadDropdown();
  if (id === 'sales') refreshSalesPicker();
  if (id === 'report') renderReport();
}

// ---------- BAKER ----------
function addBatch() {
  const type = document.getElementById('bakeType').value.trim();
  const qty = parseInt(document.getElementById('bakeQty').value);
  if (!type || !qty || qty <= 0) return alert('Enter bread type and quantity');
  batches.push({ id: Date.now(), type, qty });
  document.getElementById('bakeType').value = '';
  document.getElementById('bakeQty').value = '';
  save(); renderStock();
}

function renderStock() {
  const el = document.getElementById('stockList');
  if (!batches.length) { el.innerHTML = '<div class="empty">No bread logged yet</div>'; return; }
  el.innerHTML = batches.map(b => {
    const assigned = allocations.filter(a => a.batchId === b.id).reduce((s,a) => s + a.qtyGiven, 0);
    const remaining = b.qty - assigned;
    return `<div class="row"><span class="label">${b.type}</span><span class="value">${remaining} / ${b.qty} left</span></div>`;
  }).join('');
}

// ---------- MANAGER ----------
function refreshBreadDropdown() {
  const sel = document.getElementById('assignBread');
  sel.innerHTML = batches.map(b => {
    const assigned = allocations.filter(a => a.batchId === b.id).reduce((s,a) => s + a.qtyGiven, 0);
    const remaining = b.qty - assigned;
    return `<option value="${b.id}" ${remaining <= 0 ? 'disabled' : ''}>${b.type} (${remaining} available)</option>`;
  }).join('') || '<option>No bread available</option>';
}

function assignBread() {
  const name = document.getElementById('salesName').value.trim();
  const batchId = parseInt(document.getElementById('assignBread').value);
  const qty = parseInt(document.getElementById('assignQty').value);
  const price = parseFloat(document.getElementById('assignPrice').value);
  const comm = parseFloat(document.getElementById('assignComm').value) || 10;

  if (!name || !batchId || !qty || qty <= 0 || isNaN(price)) return alert('Fill all fields');

  const batch = batches.find(b => b.id === batchId);
  const alreadyAssigned = allocations.filter(a => a.batchId === batchId).reduce((s,a) => s + a.qtyGiven, 0);
  if (qty > batch.qty - alreadyAssigned) return alert('Not enough stock');

  allocations.push({
    id: Date.now(), batchId, breadType: batch.type, salesperson: name,
    qtyGiven: qty, qtyReturned: 0, price, commissionRate: comm, date: new Date().toLocaleDateString()
  });

  document.getElementById('salesName').value = '';
  document.getElementById('assignQty').value = '';
  save(); refreshBreadDropdown();
  alert(`Assigned ${qty} ${batch.type} to ${name}`);
}

// ---------- SALES ----------
function refreshSalesPicker() {
  const names = [...new Set(allocations.map(a => a.salesperson))];
  const sel = document.getElementById('salesPicker');
  const current = sel.value;
  sel.innerHTML = names.map(n => `<option>${n}</option>`).join('') || '<option>No assignments yet</option>';
  if (current && names.includes(current)) sel.value = current;
  renderSalesView();
}

function renderSalesView() {
  const name = document.getElementById('salesPicker').value;
  const el = document.getElementById('salesView');
  const mine = allocations.filter(a => a.salesperson === name);
  if (!mine.length) { el.innerHTML = '<div class="empty">No bread assigned to you yet</div>'; return; }

  el.innerHTML = mine.map(a => {
    const sold = a.qtyGiven - a.qtyReturned;
    const earned = sold * a.price;
    const commission = earned * (a.commissionRate / 100);
    return `<div class="item">
      <strong>${a.breadType}</strong> — ${a.qtyGiven} given<br>
      Sold: ${sold} | Returned: ${a.qtyReturned}<br>
      <span class="money">Commission: GHS ${commission.toFixed(2)}</span><br>
      <label style="margin-top:8px">Record returns:</label>
      <input type="number" min="0" max="${a.qtyGiven}" value="${a.qtyReturned}"
        onchange="updateReturn(${a.id}, this.value)" placeholder="Qty returned">
    </div>`;
  }).join('');
}

function updateReturn(id, val) {
  const a = allocations.find(x => x.id === id);
  const returned = Math.max(0, Math.min(parseInt(val) || 0, a.qtyGiven));
  a.qtyReturned = returned;
  save(); renderSalesView();
}

// ---------- REPORT ----------
function renderReport() {
  const el = document.getElementById('reportView');
  if (!allocations.length) { el.innerHTML = '<div class="empty">No data yet</div>'; return; }

  const byPerson = {};
  allocations.forEach(a => {
    const sold = a.qtyGiven - a.qtyReturned;
    const revenue = sold * a.price;
    const commission = revenue * (a.commissionRate / 100);
    if (!byPerson[a.salesperson]) byPerson[a.salesperson] = { given: 0, returned: 0, sold: 0, revenue: 0, commission: 0 };
    byPerson[a.salesperson].given += a.qtyGiven;
    byPerson[a.salesperson].returned += a.qtyReturned;
    byPerson[a.salesperson].sold += sold;
    byPerson[a.salesperson].revenue += revenue;
    byPerson[a.salesperson].commission += commission;
  });

  el.innerHTML = Object.entries(byPerson).map(([name, d]) => `
    <div class="item">
      <strong>${name}</strong><br>
      Given: ${d.given} | Returned: ${d.returned} | Sold: ${d.sold}<br>
      <span class="owed">To Return: GHS ${d.revenue.toFixed(2)}</span><br>
      <span class="money">Commission Earned: GHS ${d.commission.toFixed(2)}</span>
    </div>
  `).join('');
}

// ---------- INIT ----------
renderStock();
refreshSalesPicker();
</script>
</body>
</html>
